<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>👻 Paranormal Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0f0;
  }
  #app {
    position: relative;
    width: 100%; height: 100%;
  }
  #video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    z-index: 1;
  }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    pointer-events: auto;
  }
  #top-bar h1 {
    font-size: 16px;
    text-shadow: 0 0 10px #0f0;
    letter-spacing: 2px;
  }
  #fps {
    font-size: 12px;
    color: #0f0;
    text-shadow: 0 0 5px #0f0;
  }
  .btn-icon {
    background: rgba(0,0,0,0.6);
    border: 1px solid #0f0;
    color: #0f0;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(5px);
  }
  .btn-icon:active { background: #0f0; color: #000; }
  #bottom-bar {
    padding: 0 0 30px 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    pointer-events: auto;
  }
  #effects-strip {
    display: flex;
    gap: 10px;
    padding: 10px 15px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 15px;
  }
  #effects-strip::-webkit-scrollbar { display: none; }
  .effect-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border: 1px solid #333;
    background: rgba(0,0,0,0.7);
    color: #888;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'Courier New', monospace;
  }
  .effect-btn.active {
    border-color: #0f0;
    color: #0f0;
    box-shadow: 0 0 10px rgba(0,255,0,0.3);
    background: rgba(0,255,0,0.1);
  }
  .effect-btn:active { transform: scale(0.95); }
  #shutter-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 0 20px;
  }
  #shutter {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: transparent;
    position: relative;
    cursor: pointer;
    pointer-events: auto;
  }
  #shutter::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #fff;
    transition: all 0.1s;
  }
  #shutter:active::after {
    transform: scale(0.85);
    background: #0f0;
  }
  #gallery-btn {
    width: 45px; height: 45px;
    border-radius: 8px;
    border: 2px solid #fff;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  #gallery-btn img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #flash {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.1s;
  }
  #gallery-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 30;
    display: none;
    flex-direction: column;
    pointer-events: auto;
  }
  #gallery-overlay.active { display: flex; }
  #gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid #222;
  }
  #gallery-header h2 { font-size: 16px; }
  #close-gallery {
    background: none;
    border: 1px solid #0f0;
    color: #0f0;
    padding: 5px 15px;
    border-radius: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  #gallery-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
  }
  .gallery-item {
    aspect-ratio: 3/4;
    background: #111;
    position: relative;
    overflow: hidden;
  }
  .gallery-item img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .gallery-item .del-btn {
    position: absolute;
    top: 2px; right: 2px;
    background: rgba(255,0,0,0.7);
    color: #fff;
    border: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    pointer-events: auto;
  }
  #start-screen h1 {
    font-size: 28px;
    text-shadow: 0 0 20px #0f0;
    margin-bottom: 10px;
  }
  #start-screen p {
    color: #666;
    font-size: 14px;
    text-align: center;
    padding: 0 30px;
    line-height: 1.6;
  }
  #start-btn {
    padding: 15px 50px;
    background: transparent;
    border: 2px solid #0f0;
    color: #0f0;
    font-size: 18px;
    font-family: inherit;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
    letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(0,255,0,0.2);
  }
  #start-btn:active { background: #0f0; color: #000; }
  .scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 5;
  }
  #toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 1px solid #0f0;
    color: #0f0;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 25;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #error-msg {
    color: #f00;
    font-size: 13px;
    text-align: center;
    padding: 0 30px;
    margin-top: 10px;
    display: none;
  }
</style>
</head>
<body>

<div id="app">
  <div id="start-screen">
    <h1>👻 PARANORMAL CAMERA</h1>
    <p>Используй камеру телефона для создания паранормальных эффектов в реальном времени.<br><br>
    Все фото сохраняются только на твоём устройстве.</p>
    <button id="start-btn">ВКЛЮЧИТЬ КАМЕРУ</button>
    <div id="error-msg"></div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="scanlines"></div>
  <div id="flash"></div>
  <div id="toast"></div>

  <div id="ui">
    <div id="top-bar">
      <div id="fps">● LIVE</div>
      <h1>PARANORMAL CAM</h1>
      <button class="btn-icon" id="switch-cam">🔄</button>
    </div>
    <div id="bottom-bar">
      <div id="effects-strip">
        <button class="effect-btn active" data-effect="normal">📷 ОБЫЧНЫЙ</button>
        <button class="effect-btn" data-effect="ghost">👻 ПРИЗРАК</button>
        <button class="effect-btn" data-effect="glitch">💀 ГЛИТЧ</button>
        <button class="effect-btn" data-effect="thermal">🔥 ТЕПЛО</button>
        <button class="effect-btn" data-effect="negative">☠️ НЕГАТИВ</button>
        <button class="effect-btn" data-effect="vintage">📽️ ВИНТАЖ</button>
        <button class="effect-btn" data-effect="xray">💚 РЕНТГЕН</button>
        <button class="effect-btn" data-effect="portal">🌀 ПОРТАЛ</button>
        <button class="effect-btn" data-effect="matrix">🟢 МАТРИЦА</button>
        <button class="effect-btn" data-effect="blood">🩸 КРОВЬ</button>
      </div>
      <div id="shutter-row">
        <button class="btn-icon" id="switch-cam2">🔄</button>
        <button id="shutter"></button>
        <button id="gallery-btn">🖼️</button>
      </div>
    </div>
  </div>

  <div id="gallery-overlay">
    <div id="gallery-header">
      <h2>📁 ГАЛЕРЕЯ</h2>
      <button id="close-gallery">ЗАКРЫТЬ</button>
    </div>
    <div id="gallery-grid"></div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const startScreen = document.getElementById('start-screen');
const startBtn = document.getElementById('start-btn');
const shutter = document.getElementById('shutter');
const flash = document.getElementById('flash');
const galleryBtn = document.getElementById('gallery-btn');
const galleryOverlay = document.getElementById('gallery-overlay');
const closeGallery = document.getElementById('close-gallery');
const galleryGrid = document.getElementById('gallery-grid');
const toast = document.getElementById('toast');
const errorMsg = document.getElementById('error-msg');
const effectBtns = document.querySelectorAll('.effect-btn');
const switchCamBtns = [document.getElementById('switch-cam'), document.getElementById('switch-cam2')];

let currentStream = null;
let facingMode = 'environment';
let currentEffect = 'normal';
let isRunning = false;
let photos = [];
let frameCount = 0;
let lastTime = performance.now();
let ghostOffset = 0;
let glitchTimer = 0;
let matrixDrops = [];
let noiseCanvas = null;
let noiseCtx = null;

function initNoise() {
  noiseCanvas = document.createElement('canvas');
  noiseCanvas.width = 200;
  noiseCanvas.height = 200;
  noiseCtx = noiseCanvas.getContext('2d');
}

function initMatrix() {
  const cols = Math.ceil(window.innerWidth / 20);
  matrixDrops = [];
  for (let i = 0; i < cols; i++) {
    matrixDrops.push({ y: Math.random() * -100, speed: 2 + Math.random() * 4, chars: [] });
  }
}

async function startCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    await new Promise(resolve => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });
    resizeCanvas();
    startScreen.style.display = 'none';
    isRunning = true;
    initNoise();
    initMatrix();
    requestAnimationFrame(renderLoop);
    showToast('Камера активирована');
  } catch (err) {
    console.error(err);
    let msg = 'Ошибка: ' + err.message;
    if (location.protocol === 'file:') {
      msg = '❌ Файл открыт локально. Браузер блокирует камеру. Нужен HTTPS или localhost. На телефоне используй Termux (python -m http.server) или залей на GitHub Pages.';
    } else if (err.name === 'NotAllowedError') {
      msg = '❌ Доступ к камере запрещён. Разреши доступ в настройках браузера.';
    } else if (err.name === 'NotFoundError') {
      msg = '❌ Камера не найдена.';
    }
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
}

function resizeCanvas() {
  const w = video.videoWidth || window.innerWidth;
  const h = video.videoHeight || window.innerHeight;
  canvas.width = w;
  canvas.height = h;
}

function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
}

function renderLoop() {
  if (!isRunning) return;
  const w = canvas.width;
  const h = canvas.height;
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    document.getElementById('fps').textContent = `● LIVE ${frameCount} FPS`;
    frameCount = 0;
    lastTime = now;
  }
  ctx.save();
  if (facingMode === 'user') {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);
  ctx.restore();
  applyEffect(w, h);
  requestAnimationFrame(renderLoop);
}

function applyEffect(w, h) {
  if (currentEffect === 'normal') return;
  if (currentEffect === 'matrix') {
    applyMatrix(w, h);
    return;
  }
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  switch (currentEffect) {
    case 'ghost': applyGhost(data, w, h); break;
    case 'glitch': applyGlitch(data, w, h); break;
    case 'thermal': applyThermal(data); break;
    case 'negative': applyNegative(data); break;
    case 'vintage': applyVintage(data, w, h); break;
    case 'xray': applyXRay(data); break;
    case 'portal': applyPortal(data, w, h); break;
    case 'blood': applyBlood(data); break;
  }
  ctx.putImageData(imageData, 0, 0);
  if (currentEffect === 'ghost') drawGhostOverlay(w, h);
  if (currentEffect === 'vintage') { drawVignette(w, h); drawScratches(w, h); }
  if (currentEffect === 'glitch') drawGlitchLines(w, h);
}

function applyGhost(data, w, h) {
  ghostOffset += 0.02;
  const intensity = 0.4 + Math.sin(ghostOffset) * 0.2;
  for (let i = 0; i < data.length; i += 4) {
    data[i] = data[i] * (1 - intensity) + 180 * intensity;
    data[i+1] = data[i+1] * (1 - intensity) + 220 * intensity;
    data[i+2] = data[i+2] * (1 - intensity) + 255 * intensity;
  }
}

function drawGhostOverlay(w, h) {
  const time = Date.now() / 1000;
  const x = w/2 + Math.sin(time*0.5)*50;
  const y = h/2 + Math.cos(time*0.3)*30;
  const radius = 80 + Math.sin(time)*20;
  const g = ctx.createRadialGradient(x,y,0,x,y,radius);
  g.addColorStop(0, 'rgba(200,230,255,0.15)');
  g.addColorStop(0.5, 'rgba(150,200,255,0.08)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(x-25,y-10,8,12,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+25,y-10,8,12,0,0,Math.PI*2); ctx.fill();
}

function applyGlitch(data, w, h) {
  glitchTimer++;
  if (glitchTimer % 5 !== 0) return;
  for (let y = 0; y < h; y += 2) {
    if (Math.random() > 0.9) {
      const offset = Math.floor(Math.random()*40)-20;
      const rowStart = y*w*4;
      for (let x = 0; x < w; x++) {
        const idx = rowStart + x*4;
        const srcIdx = rowStart + ((x+offset+w)%w)*4;
        if (Math.random() > 0.5) {
          data[idx] = data[srcIdx];
          data[idx+1] = data[srcIdx+1]*0.5;
          data[idx+2] = data[srcIdx+2]*1.5;
        }
      }
    }
  }
  for (let i = 0; i < data.length; i += 4) {
    if (Math.random() > 0.98) {
      const val = Math.random()*255;
      data[i] = val; data[i+1] = val*0.2; data[i+2] = val*0.8;
    }
  }
}

function drawGlitchLines(w, h) {
  ctx.strokeStyle = 'rgba(0,255,100,0.3)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const y = Math.random()*h;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
}

function applyThermal(data) {
  for (let i = 0; i < data.length; i += 4) {
    const b = (data[i]+data[i+1]+data[i+2])/3;
    if (b < 64) { data[i]=0; data[i+1]=0; data[i+2]=b*4; }
    else if (b < 128) { data[i]=0; data[i+1]=(b-64)*4; data[i+2]=255; }
    else if (b < 192) { data[i]=(b-128)*4; data[i+1]=255; data[i+2]=255-(b-128)*4; }
    else { data[i]=255; data[i+1]=255-(b-192)*4; data[i+2]=0; }
  }
}

function applyNegative(data) {
  for (let i = 0; i < data.length; i += 4) {
    data[i] = 255-data[i];
    data[i+1] = 255-data[i+1];
    data[i+2] = 255-data[i+2];
  }
}

function applyVintage(data, w, h) {
  for (let i = 0; i < data.length; i += 4) {
    const r=data[i], g=data[i+1], b=data[i+2];
    data[i] = Math.min(255, r*0.393+g*0.769+b*0.189);
    data[i+1] = Math.min(255, r*0.349+g*0.686+b*0.168);
    data[i+2] = Math.min(255, r*0.272+g*0.534+b*0.131);
    if (Math.random() > 0.7) {
      const n = (Math.random()-0.5)*30;
      data[i]+=n; data[i+1]+=n; data[i+2]+=n;
    }
  }
}

function drawVignette(w, h) {
  const g = ctx.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(60,30,0,0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}

function drawScratches(w, h) {
  ctx.strokeStyle = 'rgba(255,255,200,0.15)';
  ctx.lineWidth = 1;
  const t = Date.now()/1000;
  for (let i=0;i<5;i++) {
    const x = (Math.sin(t*0.3+i*2)*0.5+0.5)*w;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+Math.sin(t+i)*20,h); ctx.stroke();
  }
}

function applyXRay(data) {
  for (let i = 0; i < data.length; i += 4) {
    const b = 255-(data[i]+data[i+1]+data[i+2])/3;
    data[i] = b*0.3; data[i+1] = b*0.9; data[i+2] = b*0.5;
  }
}

function applyPortal(data, w, h) {
  const t = Date.now()/1000;
  const cx=w/2, cy=h/2;
  for (let y=0;y<h;y++) {
    for (let x=0;x<w;x++) {
      const dx=x-cx, dy=y-cy;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const ang = Math.atan2(dy,dx);
      const twist = Math.sin(dist*0.02-t*2)*0.3;
      const newAng = ang+twist;
      const srcX = Math.floor(cx+Math.cos(newAng)*dist);
      const srcY = Math.floor(cy+Math.sin(newAng)*dist);
      if (srcX>=0 && srcX<w && srcY>=0 && srcY<h) {
        const srcIdx=(srcY*w+srcX)*4;
        const dstIdx=(y*w+x)*4;
        data[dstIdx]=data[srcIdx];
        data[dstIdx+1]=data[srcIdx+1];
        data[dstIdx+2]=data[srcIdx+2];
      }
    }
  }
  for (let i=0;i<data.length;i+=4) {
    data[i]=data[i]*0.8+30;
    data[i+1]=data[i+1]*0.6;
    data[i+2]=data[i+2]*1.2+50;
  }
}

function applyMatrix(w, h) {
  const imageData = ctx.getImageData(0,0,w,h);
  const data = imageData.data;
  for (let i=0;i<data.length;i+=4) {
    const b=(data[i]+data[i+1]+data[i+2])/3;
    data[i]=b*0.2; data[i+1]=b*0.8; data[i+2]=b*0.2;
  }
  ctx.putImageData(imageData,0,0);
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,w,h);
  ctx.font = '16px monospace';
  const cols = matrixDrops.length;
  const colWidth = w/cols;
  for (let i=0;i<cols;i++) {
    const drop = matrixDrops[i];
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    const ch = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillStyle = `rgba(0,255,70,${Math.random()*0.5+0.5})`;
    ctx.fillText(ch, i*colWidth, drop.y);
    drop.y += drop.speed;
    if (drop.y > h) { drop.y = -20; drop.speed = 2+Math.random()*4; }
  }
}

function applyBlood(data) {
  for (let i=0;i<data.length;i+=4) {
    data[i] = Math.min(255, data[i]*1.3+30);
    data[i+1] = data[i+1]*0.5;
    data[i+2] = data[i+2]*0.4;
  }
}

function takePhoto() {
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 100);
  const photoCanvas = document.createElement('canvas');
  photoCanvas.width = canvas.width;
  photoCanvas.height = canvas.height;
  const pCtx = photoCanvas.getContext('2d');
  pCtx.drawImage(canvas, 0, 0);
  pCtx.fillStyle = 'rgba(0,255,0,0.5)';
  pCtx.font = '14px monospace';
  pCtx.fillText('PARANORMAL CAM', 15, photoCanvas.height-15);
  const dataUrl = photoCanvas.toDataURL('image/jpeg', 0.9);
  photos.unshift(dataUrl);
  updateGalleryPreview();
  showToast('📸 Фото сохранено!');
  try {
    const link = document.createElement('a');
    link.download = 'paranormal_' + Date.now() + '.jpg';
    link.href = dataUrl;
    link.click();
  } catch(e) {}
}

function updateGalleryPreview() {
  if (photos.length > 0) {
    galleryBtn.innerHTML = `<img src="${photos[0]}" alt="preview">`;
  }
}

function openGallery() {
  galleryGrid.innerHTML = '';
  photos.forEach((photo, index) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `<img src="${photo}" alt="photo"><button class="del-btn" data-index="${index}">×</button>`;
    galleryGrid.appendChild(item);
  });
  galleryGrid.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index);
      photos.splice(idx, 1);
      openGallery();
      if (photos.length === 0) galleryBtn.innerHTML = '🖼️';
      else updateGalleryPreview();
    });
  });
  galleryOverlay.classList.add('active');
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

startBtn.addEventListener('click', startCamera);
shutter.addEventListener('click', takePhoto);
galleryBtn.addEventListener('click', openGallery);
closeGallery.addEventListener('click', () => galleryOverlay.classList.remove('active'));
switchCamBtns.forEach(btn => btn.addEventListener('click', switchCamera));
effectBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    effectBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentEffect = btn.dataset.effect;
    showToast('Эффект: ' + btn.textContent);
  });
});
window.addEventListener('resize', () => { if (video.videoWidth) resizeCanvas(); });
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#effects-strip')) return;
  e.preventDefault();
}, { passive: false });
</script>
</body>
